name: census

# The API census's generated numbers -- docs/API-COVERAGE.md, the README's
# API-CENSUS block and docs/HOLES.md's API-CENSUS-HOLES block -- re-rendered
# from the committed summary (docs/api-coverage.json) and compared byte for
# byte. A count typed by hand into any of them fails here
# (docs/plans/api-differential.md, P6).
#
# What this does NOT do is re-measure: the coverage runs need the C oracle and
# an hour of cargo-mutants, so `tools/api-census/run.sh` and `census.py` (no
# flag) are run locally and their summary committed. This job proves the
# documents are that summary, nothing more and nothing less.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: census --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/api-census/census.py --check
