[workspace]
# Standalone workspace on purpose: the Kairos umbrella has no root Cargo.toml so
# that every package directory beside it can be its own independent workspace.
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Remade With Rust"]
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
kairos-alloc = { path = "crates/kairos-alloc" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# The house UI chrome: status glyphs as named constants, ASCII-safe in source.
# `default-features = false` because the binary installs the allocator itself
# through the seam below (one link, one allocator).
rusty_symbols = { version = "0.1", default-features = false }
# The allocator, pinned EXACTLY in the seam crate and nowhere else.
rusty_alloc-api = { version = "=2.0.4", default-features = false }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
